<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creature</title>
  <link rel="stylesheet" href="creature.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="creature.js" defer></script>
</head>


<body>
<h1>Yuna's Expressions</h1>
<p>Click the button to see Yuna's different expressions!</p>
    <button id="change-button">Change appearance</button>
 <div id="stage">
    <div id="Yuna-container">
        <div class="expression active" id="neutral">
            <img src="images/neutral-yuna.png" alt="Neutral Expression">
            <p class="speech">Hi! My name is Yuna! It's nice to meet you!</p>
        </div>

        <div class="expression" id="happy">
            <img src="images/happy-yuna.png" alt="Happy Expression">
            <p class="speech">What a great day today! I hope we can figure out how to make the most of it!</p>
        </div>

        <div class="expression" id="love">
            <img src="images/love-yuna.png" alt="Love Expression">
            <p class="speech">Hehe! I love spending time with you!</p>
        </div>
    </div>
</div>

</body>
</html>
